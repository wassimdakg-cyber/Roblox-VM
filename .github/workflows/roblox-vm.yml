name: Roblox VM (KasmVNC)

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: "How many hours to keep the session alive"
        required: false
        default: "6"
  push:
    branches:
      - master

jobs:
  run-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wine, Xvfb and KasmVNC
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine xvfb x11-utils xauth net-tools curl \
            fonts-liberation libnss3 libasound2t64
          curl -fsSLo kasmvnc.deb \
            https://github.com/kasmtech/KasmVNC/releases/download/v1.5.0/kasmvncserver_noble_1.5.0_amd64.deb
          sudo apt-get install -y ./kasmvnc.deb
          sudo adduser $USER ssl-cert

      - name: Configure and start KasmVNC
        run: |
          mkdir -p ~/.vnc
          # create kasmvnc password non-interactively (view-only = n)
          (kasmvncpasswd -u $USER -p password -wo 2>/dev/null || \
           printf 'password\npassword\nn\n' | timeout 15 kasmvncpasswd -u $USER -wo 2>/dev/null || true)
          printf 'network:\n  protocol: http\n  interface: 0.0.0.0\n  websocket_port: 6901\n  use_ipv4: true\n  ssl:\n    require_ssl: false\nserver:\n  advanced:\n    kasm_password_file: ${HOME}/.kasmpasswd\n  auto_shutdown:\n    no_user_session_timeout: never\n    active_user_session_timeout: never\n    inactive_user_session_timeout: never\n' > ~/.vnc/kasmvnc.yaml
          (kasmvncserver :1 -localhost no -geometry 1600x900 -depth 24 -disableBasicAuth >/tmp/kasmvnc.log 2>&1 &)
          export DISPLAY=:1
          for i in $(seq 1 30); do
            xdpyinfo -display $DISPLAY >/dev/null 2>&1 && { echo "X ready"; break; }
            sleep 2
          done
          cat /tmp/kasmvnc.log

      - name: Download and install Roblox
        run: |
          guid=$(curl -fsSL "https://clientsettingscdn.roblox.com/v2/client-version/WindowsPlayer" | python3 -c "import sys,json;print(json.load(sys.stdin)['clientVersionUpload'])")
          echo "Roblox version guid: $guid"
          echo "ROBLOX_GUID=$guid" >> "$GITHUB_ENV"
          curl -fsSLo /tmp/roblox.exe "https://setup.rbxcdn.com/${guid}-RobloxPlayerInstaller.exe" || true
          ls -la /tmp/roblox.exe || echo "download failed"
          WINEARCH=win64 WINEDEBUG=-all xvfb-run -a wine /tmp/roblox.exe /silent || true
          # deterministic run requires audio and openGL libs
          sudo apt-get install -y --no-install-recommends \
            libgl1:i386 libopenal1:i386 libfontconfig1:i386 libfreetype6:i386 || true

      - name: Launch Roblox Player behind Xvfb
        run: |
          export DISPLAY=:1
          version_dir=$(ls -d "$HOME"/.wine/drive_c/Program\ Files*/Roblox/Versions/* 2>/dev/null | head -n1)
          echo "Found Roblox version dir: $version_dir"
          if [ -n "$version_dir" ]; then
            WINEDEBUG=-all wine "$version_dir/RobloxPlayerLauncher.exe" &
            disown
          else
            echo "No Roblox version directory found - install may have failed"
          fi
          sleep 5
          echo "Roblox launch attempted (may not render without GPU)"

      - name: Expose KasmVNC through a tunnel
        run: |
          # install bore tunnel client
          (curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/bore.tgz \
            && tar -xzf /tmp/bore.tgz -C /tmp && sudo mv /tmp/bore /usr/local/bin/) 2>/dev/null || true
          command -v bore || echo "bore install failed, will still report local status"
          # confirm KasmVNC is actually serving HTTP locally
          echo "--- KasmVNC local check ---"
          curl -fsS -o /dev/null -w "kasmvnc_http_code=%{http_code}\n" http://localhost:6901 || echo "kasmvnc not responding on 6901"
          ss -ltnp 2>/dev/null | grep -E '6901|5901' || echo "no listener on 6901/5901"
          # open tunnel
          if command -v bore >/dev/null 2>&1; then
            (nohup bore local 6901 --to bore.pub > bore.log 2>&1 &)
            for i in $(seq 1 30); do
              url=$(grep -oE 'https?://[a-zA-Z0-9.-]+' bore.log | head -n1)
              [ -n "$url" ] && break
              sleep 2
            done
            echo "VNC TUNNEL URL: $url"
            echo "url=$url" >> "$GITHUB_ENV"
          else
            url=""
            echo "VNC TUNNEL URL: (bore unavailable - use runner port forwarding instead)"
          fi
          echo "Session will stay alive for ${{ github.event.inputs.session_hours || '6' }} hours (max 6h per GitHub Actions run)."

      - name: Show VNC URL in run summary
        run: |
          {
            echo "## Roblox VM is ready"
            echo ""
            echo "**VNC TUNNEL URL:** ${url:-<not set>}"
            echo ""
            echo "Open the URL in your browser. Basic auth is disabled."
            echo ""
            echo "> NOTE: No GPU on GitHub runners, so Roblox may open the launcher but not render the game."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        run: |
          sleep $(( 3600 * ${{ github.event.inputs.session_hours || '6' }} ))
